# Serves the built frontend and forwards the API to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Dataset uploads (zip archives) up to MAX_UPLOAD_BYTES.
    client_max_body_size 2g;

    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live run events (SSE) and large uploads must not be buffered.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/sandboxes/…, /runs/…) all load the app.
    location / {
        try_files $uri /index.html;
    }
}
